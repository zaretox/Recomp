<title>RECOMP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<style>
  /* ═══ AFFICHE — papier, encre, aplats de couleur ═══ */
  :root{--pa:#F1F2EE;--ink:#121212;--mu:#52524C;--dim:#77776F;--sp:#FF4F2B;--nu:#16A863;--bu:#2448FF;--sc:#FFD43B;
    --an:"Anton",Impact,"Arial Narrow",sans-serif;--ui:"Bricolage Grotesque",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);color-scheme:light}
  html,body{margin:0;padding:0;height:100%;background:var(--pa);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  *{box-sizing:border-box}
  #root{height:100%}
  input,select,textarea,button{font-family:inherit}
  button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
  @keyframes rcFade{from{opacity:0}to{opacity:1}}
  @keyframes rcUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes rcDrop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
  @keyframes rcPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
  @keyframes rcLetter{from{transform:translateY(105%)}to{transform:none}}

  /* Structure : accueil-sommaire défilant ; les 4 affiches montent par-dessus quand on les ouvre */
  .app{position:fixed;inset:0;overflow:hidden;background:var(--pa)}
  .home-scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(18px + var(--safe-t)) 16px calc(36px + var(--safe-b))}
  .app.has-open .home-scroll{overflow:hidden}
  .pst{position:absolute;top:0;height:100%;display:flex;flex-direction:column;transition:transform .6s cubic-bezier(.75,0,.15,1),left .45s cubic-bezier(.6,0,.2,1),width .45s cubic-bezier(.6,0,.2,1);box-shadow:0 -8px 24px #12121226;will-change:transform}
  .pst-tab{flex:none;display:flex;align-items:center;gap:10px;width:100%;height:52px;padding:0 18px;border:0;background:none;color:inherit;text-align:left;cursor:pointer;touch-action:none}
  .pst-name{font-family:var(--an);font-weight:400;font-size:30px;line-height:1;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap}
  .pst-sub{margin-left:auto;font-size:12.5px;font-weight:700;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .pst.compact .pst-tab{justify-content:center;padding:0 4px}
  .pst.compact .pst-name{font-size:17px}
  .pst.compact .pst-sub{display:none}
  .pst.open .pst-tab{height:auto;padding:calc(12px + var(--safe-t)) 18px 6px}
  .pst.open .pst-name{font-size:34px}
  .pst.open .pst-sub{font-size:12.5px}
  .pst-close{flex:none;width:34px;height:34px;border-radius:50%;border:2.5px solid currentColor;display:grid;place-items:center;font-size:17px;font-weight:800;line-height:1}
  /* Ouverte : l'affiche du jour puis la feuille d'onglets défilent ensemble */
  .pst-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;animation:rcFade .35s .2s both}
  .pst-body{min-height:70%;background:var(--pa);color:var(--ink);border-radius:14px 14px 0 0;padding:16px 14px calc(30px + var(--safe-b));box-shadow:0 -6px 18px #12121218}
  /* Tous les grands chiffres des écrans (≥ 20 px, gras) passent en caractères d'affiche */
  .app [style*="font-size: 2"][style*="font-weight: 800"],.app [style*="font-size: 3"][style*="font-weight: 800"],.app [style*="font-size: 4"][style*="font-weight: 800"],.app [style*="font-size: 5"][style*="font-weight: 800"],
  .app [style*="font-size: 2"][style*="font-weight: 900"],.app [style*="font-size: 3"][style*="font-weight: 900"]{font-family:var(--an)!important;font-weight:400!important;letter-spacing:.005em}
  /* Rangées d'onglets défilantes : pas de barre de défilement visible */
  .app div{scrollbar-width:none}
  .app div::-webkit-scrollbar{display:none}

  /* Accueil-affiche */
  .home{max-width:560px;margin:0 auto}
  .home-meta{display:flex;justify-content:space-between;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;animation:rcDrop .5s .1s both}
  .home-logo{margin:8px -2px 0;font-family:var(--an);font-weight:400;font-size:clamp(72px,24vw,108px);line-height:.86;display:flex;overflow:hidden;letter-spacing:-.005em}
  .home-logo span{display:inline-block;animation:rcLetter .75s cubic-bezier(.2,.9,.1,1) both}
  .home-wrow{display:flex;align-items:flex-end;gap:10px;margin-top:12px;border-top:3px solid var(--ink);padding-top:10px}
  .odo{display:flex;font-family:var(--an);font-size:clamp(92px,30vw,124px);line-height:.9;height:.9em;overflow:hidden;letter-spacing:-.02em}
  .odo-col{display:flex;flex-direction:column;transition:transform 1.4s cubic-bezier(.2,.9,.1,1)}
  .odo-col span,.odo-sep{height:.9em;line-height:.9}
  .home-unit{display:flex;flex-direction:column;gap:5px;padding-bottom:10px}
  .home-unit b{font-family:var(--an);font-weight:400;font-size:24px;line-height:1}

  .home-plan{border-top:2px solid var(--ink)}

  .home-cta{width:100%;margin-top:14px;padding:13px 0;border:2px solid var(--ink);border-radius:4px;background:var(--ink);color:#fff;font-size:14px;font-weight:800;cursor:pointer}

  /* Accueil-sommaire : recherche, journée, coach, puis toutes les fonctionnalités en tuiles par affiche */
  .som-search{display:flex;align-items:center;gap:10px;margin-top:14px;border:2.5px solid var(--ink);border-radius:999px;background:#fff;padding:0 14px;cursor:text}
  .som-search svg{width:20px;height:20px;flex:none}

  .som-search button{border:0;background:none;font-size:17px;font-weight:800;cursor:pointer;color:var(--ink);padding:6px}
  .som-sec{margin-top:16px;border:2.5px solid var(--ink);border-radius:8px;overflow:hidden;background:#fff}
  .som-head{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border:0;text-align:left}

  .som-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:2px solid var(--ink);margin:0 -2px -2px 0}
  @media (min-width:520px){.som-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  .som-tile{display:grid;align-content:start;gap:2px;min-height:60px;min-width:0;padding:10px 12px;border:0;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);background:#fff;color:var(--ink);text-align:left;cursor:pointer;animation:rcUp .3s ease-out both}
  .som-tile b{font-size:14.5px;font-weight:750;line-height:1.2}
  .som-tile span{font-size:12px;color:var(--mu);font-weight:600;line-height:1.3}
  .som-tile.main{background:var(--pa)}
  .som-tile:active{background:var(--sc)}
  .coach{border:2.5px solid var(--ink);border-radius:8px;background:#fff;padding:12px;display:grid;gap:8px;margin:16px 0 4px}
  .coach-h{display:flex;align-items:center;gap:10px;font-size:15px}
  .coach-ava{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--sc);font-family:var(--an);font-size:19px;display:grid;place-items:center;flex:none}
  .coach-msg{background:var(--pa);border-radius:12px 12px 12px 4px;padding:9px 12px;font-size:14.5px;line-height:1.4;font-weight:600}
  .coach-sugg{display:flex;gap:6px;overflow-x:auto;margin:2px -12px 0;padding:2px 12px}
  .coach-sugg button{flex:none;border:2px solid var(--ink);background:var(--sc);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap}

  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

  /* Démarrage / erreur */
  #boot{height:100%;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;padding:0 20px calc(40px + var(--safe-b));gap:6px;color:var(--ink)}
  #boot b{font-family:var(--an);font-weight:400;font-size:84px;line-height:.86}
  #boot span{font-size:13px;font-weight:700;color:var(--mu)}
  #fatal{position:fixed;inset:0;display:none;flex-direction:column;align-items:flex-start;justify-content:flex-end;background:var(--sp);color:var(--ink);padding:24px 20px calc(40px + var(--safe-b));gap:12px;z-index:9999}
  #fatal b{font-family:var(--an);font-weight:400;font-size:64px;line-height:.9}
  #fatal button{padding:13px 22px;border-radius:4px;border:2px solid var(--ink);background:var(--ink);color:#fff;font-weight:800;font-size:15px}
</style>
</head>
<body>
<div id="root"><div id="boot"><b>RECOMP</b><span>Chargement…</span></div></div>
<div id="fatal"><b>Oups.</b><div style="font-size:16px;font-weight:700;line-height:1.4">Impossible de démarrer l'app.<br>Vérifie ta connexion puis réessaie.</div><div id="fatalmsg" style="font-size:12px;opacity:.75"></div><button onclick="location.reload(true)">Réessayer</button></div>
<script>
/* Écran "Impossible de démarrer" si un fichier ne charge pas ou plante avant le premier affichage */
function recompFatal(msg){var b=document.getElementById("boot");if(!b||!document.body.contains(b))return;var f=document.getElementById("fatal");if(f)f.style.display="flex";var m=document.getElementById("fatalmsg");if(m&&msg)m.textContent=msg;}
window.addEventListener("error",function(e){recompFatal(e&&e.message);});
</script>
<script src="vendor/react.production.min.js" onerror="recompFatal('react.production.min.js introuvable')"></script>
<script src="vendor/react-dom.production.min.js" onerror="recompFatal('react-dom.production.min.js introuvable')"></script>
<script src="app.js" onerror="recompFatal('app.js introuvable')"></script>
<script>
if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(function(e){console.warn("SW",e);});}
setTimeout(function(){recompFatal("");},12000);
</script>
</body>
